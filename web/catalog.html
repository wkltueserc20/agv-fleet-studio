<section class="panel api-catalog" id="api-catalog">
<div class="panel-head"><div><h2>目前有哪些 API？</h2><p class="sub">以下是本機 Rust 原型已實作的介面，依通訊用途分類，與海康 API 分開。外部人員只對介接服務下任務；診斷及模擬接口不屬外部契約。點選可看用途與格式範例。</p></div><a class="button" href="#api-traffic">回到實際傳輸 ↑</a></div>
<div class="api-tools"><label>依用途查看<select id="catalog-contract"><option value="external">外部任務入口</option><option value="all">全部用途（含診斷與模擬）</option><option value="workflow">WCS 作業流程</option><option value="equipment">ECS 設備互動</option><option value="management">車隊管理</option><option value="device">設備通訊／本車操作</option><option value="diagnostic">畫面／診斷</option><option value="simulation">模擬測試</option><option value="legacy">舊版相容</option></select></label><label>依服務查看<select id="catalog-role"><option value="all">全部服務</option><option value="central">介接服務 :8210</option><option value="rcs">RCS :8211</option><option value="wcs">WCS :8215</option><option value="ecs">ECS :8216</option><option value="agv">三台 AGV :8212／8213／8214</option></select></label><span class="sub" id="catalog-count" aria-live="polite">讀取 API 清單…</span></div>
<div class="catalog-layout"><div class="table-wrap"><table><thead><tr><th>接收服務</th><th>方法／路徑</th><th>用途</th></tr></thead><tbody id="catalog-rows"></tbody></table></div><div class="catalog-inspector"><h3 id="catalog-title">選擇一個介面</h3><p id="catalog-direction" class="sub"></p><div class="api-meta" id="catalog-url"></div><p id="catalog-notes" class="catalog-notes"></p><div class="api-payloads"><div><h3>請求格式範例</h3><pre id="catalog-request"></pre></div><div><h3>回應格式範例</h3><pre id="catalog-response"></pre></div></div><p class="api-desc">此區是格式說明；省略不影響理解的回應欄位，不是剛才呼叫的即時資料。實際內容請看上方傳輸紀錄。</p></div></div>
</section>
<style>
.api-catalog{margin-bottom:24px}.api-catalog .panel-head{flex-wrap:wrap}.catalog-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-top:1px solid var(--line)}.catalog-layout .table-wrap{max-height:480px;overflow:auto;border-right:1px solid var(--line)}.catalog-layout th{position:sticky;top:0}.catalog-inspector{padding:20px;min-width:0}.catalog-inspector .api-payloads{grid-template-columns:1fr}.catalog-notes{font-size:13px}.catalog-path{border:0;background:none;padding:0;text-align:left;color:var(--green);font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere;max-width:100%}.catalog-path[aria-pressed=true]{font-weight:700;text-decoration:underline}.catalog-layout td{font-size:12px;overflow-wrap:anywhere}.api-clocks{display:grid;grid-template-columns:1fr;gap:7px;margin-top:12px}.api-clock{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(0,1.4fr);gap:10px;font-size:11px;background:#f1f5eb;padding:8px 11px;border-radius:5px}.api-clock span{color:var(--muted)}.api-clock time{overflow-wrap:anywhere;font-family:Consolas,monospace}.task-clock-panel{margin:0 22px 16px;border-top:1px solid var(--line);padding-top:15px}.task-clock-panel h3{font-size:13px;overflow-wrap:anywhere}.task-clock-panel .api-clocks{grid-template-columns:1fr 1fr}.task-clock-panel .api-clock{grid-template-columns:1fr;gap:2px}.task-clock-note{font-size:10px;color:var(--muted)}.api-entry .trace-time{flex-wrap:wrap;gap:3px}.api-traffic .api-foot a{color:var(--green);text-decoration:underline}@media(max-width:1050px){.catalog-layout{grid-template-columns:1fr}.catalog-layout .table-wrap{border-right:0;border-bottom:1px solid var(--line);max-height:330px}}@media(max-width:600px){.task-clock-panel{margin:0 18px 15px}.task-clock-panel .api-clocks{grid-template-columns:1fr}.api-clock{grid-template-columns:1fr;gap:3px}.catalog-inspector{padding:18px}}
</style>
<script>
(()=>{
const get=id=>document.getElementById(id);const names={wcs:'WCS :8215',ecs:'ECS :8216',all:'介接服務／RCS／三車端共用',central:'介接服務 :8210',rcs:'RCS :8211',agv:'三台 AGV'};const contracts={workflow:'WCS 作業流程',equipment:'ECS 設備互動',external:'外部任務入口',management:'車隊管理',device:'設備通訊／本車操作',diagnostic:'畫面／診斷',simulation:'模擬測試',legacy:'舊版相容'};let data=null,selected=null;
function show(e){selected=e.role+e.method+e.path;get('catalog-title').textContent=e.title;get('catalog-direction').textContent=contracts[e.contract]+' ｜ '+e.direction+' ｜ '+e.contract_version;const ports=e.role==='all'?[8210,8211,8212,8213,8214]:e.role==='agv'?[8212,8213,8214]:[{central:8210,rcs:8211,wcs:8215,ecs:8216}[e.role]];get('catalog-url').textContent=ports.map(p=>e.method+' http://127.0.0.1:'+p+e.path).join('\n');get('catalog-notes').textContent=e.notes;get('catalog-request').textContent=e.request===null?'（GET 沒有 JSON 本文）':JSON.stringify(e.request,null,2);get('catalog-response').textContent=JSON.stringify(e.response,null,2);document.querySelectorAll('.catalog-path').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===selected)));}
function draw(){if(!data)return;const role=get('catalog-role').value;const contract=get('catalog-contract').value;const entries=data.entries.filter(e=>(role==='all'||e.role===role||(e.role==='all'&&['central','rcs','agv'].includes(role)))&&(contract==='all'||e.contract===contract));get('catalog-count').textContent='符合 '+entries.length+' 種接口；全專案 '+data.entry_count+' 種定義／'+data.service_route_count+' 個服務入口。';get('catalog-rows').replaceChildren();entries.forEach(e=>{const tr=document.createElement('tr');const service=document.createElement('td');service.textContent=names[e.role];const path=document.createElement('td');const b=document.createElement('button');b.type='button';b.className='catalog-path';b.dataset.key=e.role+e.method+e.path;b.textContent=e.method+' '+e.path;b.onclick=()=>show(e);path.append(b);const title=document.createElement('td');title.textContent=e.title;tr.append(service,path,title);get('catalog-rows').append(tr);});if(!entries.length){get('catalog-title').textContent='此分類沒有符合的接口';['catalog-direction','catalog-url','catalog-notes','catalog-request','catalog-response'].forEach(id=>get(id).textContent='');return;}show(entries.find(e=>e.role+e.method+e.path===selected)||entries.find(e=>e.role==='rcs'&&e.path==='/api/tasks')||entries[0]);}
get('catalog-role').onchange=draw;get('catalog-contract').onchange=draw;fetch('/api/catalog').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(v=>{data=v;draw();}).catch(e=>{get('catalog-count').textContent='API 清單讀取失敗：'+e.message;});
})();
</script>

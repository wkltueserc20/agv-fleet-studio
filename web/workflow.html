<section class="panel workflow-panel" id="workflow-control"><div class="panel-head"><div><h2>WCS 整張作業與 ECS 設備握手</h2><p class="sub">介接服務接單 → WCS 管流程；RCS 管車輛與路徑；ECS 確認模擬設備交接。</p></div><a class="button" href="http://127.0.0.1:8215/" target="_blank" rel="noopener">WCS 流程</a><a class="button" href="http://127.0.0.1:8216/" target="_blank" rel="noopener">ECS 設備</a></div><div class="panel-body"><p class="sub" id="workflow-status" role="status">讀取作業服務…</p><a id="workflow-attention" class="workflow-wait" href="http://127.0.0.1:8215/#attention" hidden></a><label for="workflow-job">追蹤整張作業</label><select id="workflow-job"><option value="">尚無作業</option></select><div id="workflow-detail"></div><p class="sub">「暫停後續步驟」不會停止已派發的移動或交接。設備握手目前是模擬，尚未連接 PLC／車端取放感測；取消會先協調停止與確認結果；載貨、道路或結果待確認時保留資源，不能直接恢復或解除。</p></div></section>
<style>.workflow-panel{margin-bottom:18px}.workflow-panel .panel-head{flex-wrap:wrap}.workflow-panel .panel-head .button{font-size:12px}.workflow-stages{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.workflow-stage{padding:5px 9px;border-radius:6px;background:#f0f4eb;font-size:12px}.workflow-stage.current{background:#266549;color:white}.workflow-stage.done{background:#deebcc}.workflow-wait{background:#fff1d9;padding:10px;border-radius:6px;font-size:13px}.workflow-panel small{display:block;color:var(--muted)}.role-agv .workflow-panel{display:none!important}</style>
<style>.workflow-cancel-state{margin:12px 0;padding:10px 12px;border:1px solid #e6d1b0;background:#fff7e8;border-radius:7px;font-size:12px}.workflow-cancel-state small{margin-top:4px}.workflow-cancel-button{margin-left:8px}.workflow-stage.stopped{background:#edeff0;color:#62717c}@media(max-width:600px){.workflow-cancel-button{margin:8px 0 0;width:100%}}</style>

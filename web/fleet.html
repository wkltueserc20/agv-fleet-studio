<section class="panel fleet-panel" id="fleet-overview"><div class="panel-head"><div><h2>工廠地圖與即時調度</h2><p class="sub">任務先進先出；RCS 選取料點最近的空閒車。三車皆忙時，下一張留在佇列。</p></div><span class="badge" id="fleet-summary">讀取車隊…</span></div><div class="stats"><div class="stat"><span>等待派車</span><strong id="queue-count">—</strong></div><div class="stat"><span>執行中任務</span><strong id="running-count">—</strong></div><div class="stat"><span>已完成</span><strong id="complete-count">—</strong></div></div><div class="factory-toolbar"><div class="factory-zoom"><button type="button" id="map-zoom-out" aria-label="縮小地圖">−</button><span id="map-zoom-label">100%</span><button type="button" id="map-zoom-in" aria-label="放大地圖">＋</button><button type="button" id="map-fit">全圖</button></div><select id="map-focus" aria-label="定位廠區"><option value="all">全部廠區</option><option value="machine">生產機台</option><option value="charging">充電站</option><option value="standby">待命區</option><option value="idle">空閒區</option></select><button type="button" id="map-expand" aria-expanded="false">大圖檢視</button><button type='button' id='map-order'>提出需求</button><span class="factory-count" id="factory-count">讀取廠區…</span></div>

<div class="factory-zone zone-production"><span>生產／加工區</span></div><div class="factory-zone zone-charging"><span>充電區</span></div><div class="factory-zone zone-standby"><span>待命區</span></div><div class="factory-zone zone-idle"><span>空閒停車區</span></div><svg id="fleet-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="fleet-markers"></div></div></div><div class="factory-key"><span class="machine">▥ 生產機台</span><span class="charging">ϟ 充電站</span><span class="standby">◎ 待命</span><span class="idle">P 空閒停車</span><span>○ J1–J18 路徑點</span><span>可放大後拖曳地圖；Esc 退出大圖</span></div><div class="road-legend"><span>可行駛道路（箭頭為單向）</span><span>已預約路段</span><span>車輛核准路徑</span></div><p class="map-caption">車輛依路網逐段移動；RCS 預約路段與路口，確認到站後釋放。未接真車、ROS 或 PLC。</p><div id="fleet-cards" class="fleet-cards"></div><div class="vehicle-line"><label class="fleet-observer">目前觀察<select id="observe-vehicle"><option value="CT-SIM-01">CT-SIM-01</option><option value="CT-SIM-02">CT-SIM-02</option><option value="CT-SIM-03">CT-SIM-03</option></select></label><span class="badge" id="vehicle-state">讀取中</span><span id="vehicle-phase">等待任務</span><div class="bar"><div id="progress-bar"></div></div><span id="progress-text">0%</span></div></section>
<style>

zone{z-index:0}.factory-map svg{z-index:1}

@media(max-width:760px){#fleet-overview .map-viewport{height:560px;margin:0 10px}.factory-toolbar{padding:6px 10px;gap:5px}.factory-toolbar button,.factory-toolbar select{font-size:11px;padding:3px 6px;min-height:30px}.factory-count{width:100%;font-size:10px}#fleet-overview .factory-station{font-size:10px;min-width:60px;padding:4px 5px}#fleet-overview .factory-station small{font-size:8px}#fleet-overview .factory-station .station-icon{font-size:12px}#fleet-overview .factory-station.type-passing{min-width:48px;font-size:9px}#fleet-overview .junction-marker{width:20px;height:17px;font-size:8px}.factory-key{padding:6px 10px;font-size:9px;gap:7px}.factory-zone>span{font-size:9px}.zone-charging>span{writing-mode:vertical-rl;left:auto;right:2px}body.map-expanded #fleet-overview{inset:3px}body.map-expanded #fleet-overview .map-viewport{margin:0 6px}body.map-expanded #fleet-overview .factory-count{width:auto}}
